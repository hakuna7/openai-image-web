<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 生图</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="composer" aria-labelledby="page-title">
        <div class="brand-row">
          <span class="brand-dot"></span>
          <span>Image Studio</span>
        </div>

        <header class="hero">
          <p class="eyebrow">AI Image Generator</p>
          <h1 id="page-title">把想法生成图片。</h1>
        </header>

        <form id="image-form" class="control-surface">
          <label id="apiKeyField" class="field">
            <span>API Key</span>
            <input
              id="apiKey"
              name="apiKey"
              type="password"
              placeholder="sk-..."
              autocomplete="off"
            />
          </label>

          <input id="baseUrl" name="baseUrl" type="hidden" value="https://lucen.cc/v1" />
          <input id="imageModel" name="model" type="hidden" value="gpt-image-2" />
          <input id="textModel" type="hidden" value="gpt-4o-mini" />

          <div class="hint-row">
            <p id="serverKeyHint" class="hint hidden">服务端已配置 Key。</p>
            <p id="serverBaseUrlHint" class="hint hidden">已连接中转站。</p>
          </div>

          <label class="field prompt-field">
            <span>提示词</span>
            <textarea
              id="prompt"
              name="prompt"
              rows="8"
              placeholder="例如：一间安静的未来感咖啡馆，落地窗外是雨夜城市，柔和自然光，电影级构图，高细节"
              required
            ></textarea>
          </label>

          <div class="prompt-tools">
            <button id="optimizeButton" class="soft-button" type="button">优化提示词</button>
          </div>

          <div class="option-grid">
            <label class="field">
              <span>比例</span>
              <select id="size" name="size">
                <option value="1024x1024">1:1 方图</option>
                <option value="1024x1536">9:16 竖屏</option>
                <option value="1536x1024">16:9 横屏</option>
                <option value="1024x1536">4:5 小红书/Instagram 近似</option>
                <option value="1024x1536">3:4 头像/海报近似</option>
                <option value="1536x1024">3:2 横版近似</option>
              </select>
            </label>

            <label class="field">
              <span>质量</span>
              <select id="quality" name="quality">
                <option value="low">快速</option>
                <option value="medium" selected>标准</option>
                <option value="high">高清</option>
              </select>
            </label>

            <label class="field">
              <span>背景</span>
              <select id="background" name="background">
                <option value="auto" selected>自动</option>
                <option value="opaque">实底</option>
                <option value="transparent">透明</option>
              </select>
            </label>
          </div>

          <p class="microcopy">部分平台比例会使用最接近的官方支持尺寸生成。</p>

          <div class="actions">
            <button id="submitButton" class="primary-button" type="submit">生成图片</button>
            <button id="cancelButton" class="danger-button hidden" type="button">中止</button>
            <button id="downloadButton" class="secondary-button" type="button" disabled>
              下载
            </button>
          </div>

          <p id="status" class="status">准备就绪。</p>
        </form>
      </section>

      <section class="preview-panel" aria-label="生成结果">
        <div class="preview-toolbar">
          <span>预览</span>
          <span id="meta"></span>
        </div>
        <div id="preview" class="preview empty">
          <p>生成后的图片会出现在这里</p>
        </div>
        <div id="revisedPrompt" class="revised hidden"></div>
        <div class="history-panel">
          <div class="history-head">
            <span>最近生成</span>
            <button id="clearHistoryButton" class="text-button" type="button" disabled>清空</button>
          </div>
          <div id="historyGrid" class="history-grid empty">
            <p>还没有历史图片</p>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
